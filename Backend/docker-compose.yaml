services:
  postgres:
    image: postgres:17
    container_name: eventhub-db

    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - eventhub_data:/var/lib/postgresql/data

volumes:
  eventhub_data: